<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" fill="none" role="img" aria-label="No Complaints Submitted Empty State">
  <!-- CivicCare Monochromatic Minimal Empty State Illustration -->
  <!-- Clean geometric linework, white fills, neutral gray supports, no text/lettering -->
  
  <defs>
    <!-- Crisp geometric accents -->
    <pattern id="empty-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#F0F0F0" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Ambient Ground Shadow Plane -->
  <ellipse cx="400" cy="690" rx="250" ry="20" fill="#EAEAEA"/>
  <ellipse cx="400" cy="690" rx="180" ry="12" fill="#DFDFDF"/>
  
  <!-- Subtle Decorative Technical Crosshairs -->
  <g stroke="#C4C7C7" stroke-width="2" stroke-linecap="round">
    <!-- Top Left Accent -->
    <line x1="160" y1="210" x2="176" y2="210"/>
    <line x1="168" y1="202" x2="168" y2="218"/>
    <!-- Top Right Accent -->
    <line x1="630" y1="260" x2="646" y2="260"/>
    <line x1="638" y1="252" x2="638" y2="268"/>
    <!-- Bottom Left Accent -->
    <line x1="180" y1="610" x2="196" y2="610"/>
    <line x1="188" y1="602" x2="188" y2="618"/>
  </g>

  <!-- Main Clipboard Body -->
  <g id="clipboard-group">
    <!-- Board Base (Dark charcoal backing edge for subtle depth) -->
    <rect x="236" y="196" width="340" height="470" rx="16" fill="#E2E2E2"/>
    <rect x="230" y="190" width="340" height="470" rx="16" fill="#F8F8F8" stroke="#1A1C1C" stroke-width="6"/>

    <!-- Document Paper Sheet -->
    <rect x="256" y="235" width="288" height="400" rx="8" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="3"/>
    
    <!-- Top Clamp Mount / Loop -->
    <rect x="365" y="145" width="70" height="36" rx="8" fill="#F0F0F0" stroke="#1A1C1C" stroke-width="6"/>
    <circle cx="400" cy="163" r="8" fill="#FFFFFF" stroke="#1A1C1C" stroke-width="4"/>

    <!-- Top Metal Clip -->
    <rect x="325" y="172" width="150" height="44" rx="8" fill="#FFFFFF" stroke="#1A1C1C" stroke-width="6"/>
    <!-- Clip Inner Grip Inset -->
    <line x1="345" y1="194" x2="455" y2="194" stroke="#1A1C1C" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Empty Checklist Rows (Strictly without text or lettering) -->
    <!-- Row 1 -->
    <g transform="translate(0, 0)">
      <!-- Checkbox Box (Unchecked / Empty) -->
      <rect x="288" y="275" width="28" height="28" rx="5" fill="#FFFFFF" stroke="#1A1C1C" stroke-width="4"/>
      <!-- Neutral Content Wireframe Bars -->
      <rect x="332" y="282" width="176" height="8" rx="4" fill="#1A1C1C"/>
      <rect x="332" y="297" width="112" height="6" rx="3" fill="#D5D5D5"/>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 75)">
      <!-- Checkbox Box (Unchecked / Empty) -->
      <rect x="288" y="275" width="28" height="28" rx="5" fill="#FFFFFF" stroke="#1A1C1C" stroke-width="4"/>
      <!-- Neutral Content Wireframe Bars -->
      <rect x="332" y="282" width="160" height="8" rx="4" fill="#1A1C1C"/>
      <rect x="332" y="297" width="96" height="6" rx="3" fill="#D5D5D5"/>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 150)">
      <!-- Checkbox Box (Unchecked / Empty) -->
      <rect x="288" y="275" width="28" height="28" rx="5" fill="#FFFFFF" stroke="#1A1C1C" stroke-width="4"/>
      <!-- Neutral Content Wireframe Bars -->
      <rect x="332" y="282" width="184" height="8" rx="4" fill="#1A1C1C"/>
      <rect x="332" y="297" width="124" height="6" rx="3" fill="#D5D5D5"/>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 225)">
      <!-- Checkbox Box (Unchecked / Empty) -->
      <rect x="288" y="275" width="28" height="28" rx="5" fill="#FFFFFF" stroke="#1A1C1C" stroke-width="4"/>
      <!-- Neutral Content Wireframe Bars -->
      <rect x="332" y="282" width="144" height="8" rx="4" fill="#1A1C1C"/>
      <rect x="332" y="297" width="80" height="6" rx="3" fill="#D5D5D5"/>
    </g>
    
    <!-- Document Clean Footer Rule -->
    <line x1="288" y1="580" x2="512" y2="580" stroke="#EAEAEA" stroke-width="3" stroke-dasharray="6 6"/>
  </g>

  <!-- Accompanying Location Marker Pin (Foreground Right Accent) -->
  <g id="location-marker-group" transform="translate(510, 480)">
    <!-- Pin Drop Shadow -->
    <ellipse cx="40" cy="180" rx="36" ry="10" fill="#D0D0D0"/>
    <ellipse cx="40" cy="180" rx="22" ry="6" fill="#B8B8B8"/>

    <!-- Pin Anchor Point Line Indicator -->
    <line x1="40" y1="165" x2="40" y2="176" stroke="#1A1C1C" stroke-width="4" stroke-linecap="round"/>

    <!-- Map Pin Geometry -->
    <path d="
      M40 162
      C26 142 8 116 8 82
      C8 44.5 22.3 14 40 14
      C57.7 14 72 44.5 72 82
      C72 116 54 142 40 162
      Z" 
      fill="#FFFFFF" 
      stroke="#1A1C1C" 
      stroke-width="6" 
      stroke-linejoin="round"
    />
    
    <!-- Outer Inset Ring -->
    <circle cx="40" cy="74" r="24" fill="#F0F0F0" stroke="#1A1C1C" stroke-width="5"/>
    
    <!-- Central Pin Dot -->
    <circle cx="40" cy="74" r="10" fill="#1A1C1C"/>
  </g>
</svg>
